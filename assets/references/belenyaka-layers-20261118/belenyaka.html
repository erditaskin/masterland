<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #201b16; color: #f9eddb; font: 15px system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 12px; padding: 12px; }
  fieldset { margin: 0; border: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  label { padding: 7px 13px; border-radius: 8px; background: #3a3026; cursor: pointer; }
  label:has(:checked) { background: #79522a; }
  input { accent-color: #e2b46e; vertical-align: middle; }
  .phone { width: min(100%, 440px, max(255px, calc((100svh - 78px) * 0.46))); aspect-ratio: 1206 / 2622; position: relative; container-type: inline-size; overflow: hidden; border-radius: 9% / 4%; isolation: isolate; background: #f7eddf; }
  .layer { position: absolute; pointer-events: none; }
  .base { inset: 0; width: 100%; height: 100%; }
  .orders { position: absolute; left: 7.13101%; top: 20.67124%; width: 85.90381%; height: 7.13196%; display: grid; gap: 1.15830%; grid-template-columns: repeat(3,minmax(0,1fr)); }
  main:has(#two:checked) .orders { grid-template-columns: repeat(2,minmax(0,1fr)); }
  main:has(#wide:checked) .orders { grid-template-columns: minmax(0, 392fr) minmax(0, 632fr); }
  main:not(:has(#three:checked)) .order:nth-child(3), main:not(:has(#wide:checked)) .extra { display: none; }
  .order { position: relative; display: flex; align-items: center; gap: 1cqw; padding: 1.1cqw 1.5cqw; color: #60350c; font: bold 3.25cqw Georgia, serif; }
  .order::before { content: ""; position: absolute; inset: 0; border-style: solid; border-width: 3.23383cqw 4.06302cqw; border-image: url(uyarlanabilir/ilan-karti.png) 39 49 fill / 1 / 0 stretch; pointer-events: none; }
  .product, .reward { position: relative; display: flex; flex-direction: column; align-items: center; }
  .product { width: 10cqw; gap: .2cqw; font-size: 2.85cqw; }
  .product img { width: 100%; height: 8.8cqw; object-fit: contain; }
  .reward { margin-left: auto; gap: .3cqw; line-height: 1.05; min-width: 11.45cqw; align-items: center; }
  .give { display: grid; place-items: center; background: url(uyarlanabilir/ilan-ver-dugmesi.png) center / 100% 100% no-repeat; width: 11.45cqw; height: 3.98cqw; color: #fffde7; }
  .coin { color: #ed9e0f; text-shadow: 0 .15cqw #ae6201; }
  .xp { color: #057ebd; }
  .home { position: absolute; left: 34%; right: 34%; bottom: 1.05%; height: .44%; border-radius: 999px; background: #221d15; opacity:.78; }
  .live { position:absolute; display:flex; align-items:center; justify-content:center; pointer-events:none; font:bold 3.8cqw Georgia,serif; line-height:1; color:#fff1d5; text-shadow:0 .12cqw .17cqw #562e12; white-space:nowrap; }
  .title { font-size:5.25cqw; }
  .filter { font-size:3.05cqw; }
  .plus { border: .12cqw solid #d3a44e; border-radius:50%; font:normal 3.1cqw system-ui; }
  .profile::before, .profile::after { content:""; position:absolute; background:#ffebbd; }
  .profile::before { width:46%; aspect-ratio:1; top:3%; border-radius:50%; }
  .profile::after { width:96%; height:40%; bottom:8%; border-radius:100% 100% 8% 8%; }
  .producer { border-radius:3cqw; border:.14cqw solid #dca83d; background:linear-gradient(#74440f,#4e2a08); font-size:2.7cqw; gap:.55cqw; }
  .lock { display:inline-block; position:relative; width:1.45cqw; height:1.15cqw; margin-top:.35cqw; border-radius:.2cqw; background:#fff1d5; }
  .lock::before { content:""; position:absolute; left:20%; right:20%; top:-55%; height:62%; border:.16cqw solid #fff1d5; border-radius:.6cqw .6cqw 0 0; }
  .nav-name { font-size:2.9cqw; }
  .selected-cell { border:.24cqw solid #83b845; border-radius:1.6cqw; background:#a6bf5366; }
